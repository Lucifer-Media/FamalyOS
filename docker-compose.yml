version: "3.9"

# Family OS — Итерация 1.
# Разворачивается в /opt/family-os на ThinkPad, рядом с уже работающими
# сервисами (AdGuard, Prometheus, Grafana, Samba) — см.
# docs/DEPLOYMENT.md и проектную заметку "Домашний сервер — ThinkPad".
#
# Порты по умолчанию НЕ публикуются на 0.0.0.0 — только на loopback/LAN,
# по аналогии с существующей политикой ufw на сервере (см. docs/DEPLOYMENT.md
# про правила firewall, которые нужно добавить).

services:
  db:
    image: postgres:16-alpine
    container_name: family-os-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_os}
      POSTGRES_USER: ${POSTGRES_USER:-family_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?укажите пароль в .env}
    volumes:
      - family_os_db:/var/lib/postgresql/data
    networks:
      - family_os_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-family_os}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: family-os-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-family_os}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-family_os}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      TWO_FACTOR_ENC_KEY: ${TWO_FACTOR_ENC_KEY:?}
      FILE_STORAGE_ROOT: /app/uploads
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://192.168.1.18:3400}
    volumes:
      - family_os_uploads:/app/uploads
      - family_os_tesseract_cache:/app/.cache/tesseract # временный кэш воркеров OCR (языковые данные уже встроены в образ, сеть не нужна)
    networks:
      - family_os_internal
    ports:
      - "127.0.0.1:3401:3001" # только localhost — наружу через LAN см. web
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
    container_name: family-os-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    networks:
      - family_os_internal
    ports:
      - "3400:3000" # LAN-доступ, аналогично Grafana (3300) и AdGuard (3000) на этом сервере
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  family_os_internal:
    driver: bridge

volumes:
  family_os_db:
  family_os_uploads:
  family_os_tesseract_cache:
